name: Release runtime images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag and create release when needed
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "Race Replay Lab ${RELEASE_TAG#v}"
          fi

  package:
    name: Package runtime image (${{ matrix.os }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check publication safety
        shell: bash
        run: ./scripts/check-publication-safety.sh

      - name: Verify with Maven Wrapper
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build runtime archive and checksum
        id: package
        shell: bash
        run: |
          platform="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="target/race-replay-lab-runtime-$platform.zip"
          archive_name="$(basename "$archive")"
          checksum="$archive.sha256"

          ./scripts/package-runtime.sh "$platform"

          if command -v sha256sum >/dev/null 2>&1; then
            (cd target && sha256sum "$archive_name" > "$archive_name.sha256")
          else
            (cd target && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release assets
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
